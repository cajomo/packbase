spring:
  application:
    name: packbase-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/packbase
    username: packbase_app
    password: localdev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 8h
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
