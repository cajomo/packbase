services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: packbase
      POSTGRES_USER: packbase_app
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - packbase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packbase_app -d packbase"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  packbase_pgdata: